<div>

    <div class="expansion-panel-section">
     <button mat-raised-button (click)="addQuestion()">Add Question</button>
    </div>

<div *ngFor="let question of questions" class="question-card">    
<mat-accordion >
  <mat-expansion-panel hideToggle>
    <mat-expansion-panel-header>
      <mat-panel-title> {{question.question}} </mat-panel-title>
        <button mat-icon-button (click)="editQuestion(question.id,question.question, question.answer)">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button (click)="deleteQuestion(question.id)">
        <mat-icon>delete
        </mat-icon>
      </button>
    </mat-expansion-panel-header>
    <p>{{question.answer}}</p>
  </mat-expansion-panel>
  </mat-accordion>
</div>
</div>
