<div>

    <div class="expansion-panel-section">
     <button mat-raised-button (click)="addQuestion()">Add Question</button>
    </div>

<div *ngFor="let question of questions;let i=index" class="question-card">    
<mat-accordion >
  <mat-expansion-panel hideToggle>
    <mat-expansion-panel-header>
      <mat-panel-title>{{i+1}}) {{question.questions}} </mat-panel-title>
        <button mat-icon-button (click)="editQuestion(question.id,question.questions, question.answers)">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button (click)="deleteQuestion(question.id)">
        <mat-icon>delete
        </mat-icon>
      </button>
    </mat-expansion-panel-header>
    <p style="white-space: pre-line;">{{question.answers}}</p>
  </mat-expansion-panel>
  </mat-accordion>
</div>
</div>
